# ==============================================================================
# SupportDesk Production Profile Configuration (prod)
# ==============================================================================

# Production Database Configuration (strictly required via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for Production
# 'validate': validates tables and schema against entity classes without making automatic DDL changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production JWT Secret Key (strictly required via environment variable APP_JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET}

# Development Test Data Seeding is explicitly disabled in production
app.init.test-data.enabled=false

# Production CORS Configuration: Strictly configured via environment variable (e.g., https://helpdesk.company.com)
# Defaults to empty string so untrusted cross-origins are rejected unless explicitly configured by the operator.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
