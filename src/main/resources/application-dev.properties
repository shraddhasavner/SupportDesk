# SupportDesk Development Configuration

# Database Configuration - Set through environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret - Must be provided through environment variable
app.jwt.secret=${APP_JWT_SECRET}

# Development Test Data
app.init.test-data.enabled=true

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8082,http://127.0.0.1:8082,http://localhost:3000,http://localhost:5173}
