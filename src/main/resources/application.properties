# SupportDesk Common Configuration (Baseline Defaults)
spring.application.name=supportdesk
server.port=8082

# Default profile activated when no profile is explicitly specified.
# Preserves existing local development workflow out-of-the-box.
spring.profiles.default=local

# SLA Durations (in hours) based on Ticket Priority
app.sla.critical-hours=4
app.sla.high-hours=8
app.sla.medium-hours=24
app.sla.low-hours=48

# JWT Token Expiration (24 hours in milliseconds)
app.jwt.expiration-ms=86400000

# Test Data Seeding disabled by default in baseline configuration
app.init.test-data.enabled=false

# Baseline CORS Configuration: Default empty (cross-origin requests denied by default unless explicitly configured)
app.cors.allowed-origins=
